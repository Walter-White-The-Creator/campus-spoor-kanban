<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kanban — Waar knelt het schoentje?</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --todo: #3b82f6;
      --todo-bg: #eff6ff;
      --doing: #f59e0b;
      --doing-bg: #fffbeb;
      --done: #10b981;
      --done-bg: #ecfdf5;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      box-shadow: var(--shadow-sm);
    }

    .header-content {
      max-width: 1500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .top-controls {
      max-width: 1500px;
      margin: 1.25rem auto 0;
      padding: 0 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }

    .share-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      box-shadow: var(--shadow-sm);
      flex: 1;
      min-width: 300px;
    }

    .share-bar label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .share-bar input[type="text"] {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.875rem;
      font-family: inherit;
      background: #f8fafc;
      color: var(--text);
    }

    .share-bar input.room-input {
      width: 7rem;
    }

    .share-bar input:not(.room-input) {
      flex: 1;
      min-width: 12rem;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      transition: all 0.2s ease;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }

    button:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    button.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    button.primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      padding: 0.4rem 0.8rem;
      background: #f1f5f9;
      border-radius: 999px;
    }

    .sync-status .dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #94a3b8;
    }

    .sync-status.live .dot {
      background: var(--done);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .sync-status.connecting .dot {
      background: var(--doing);
      animation: pulse 1s ease infinite;
    }

    @keyframes pulse {
      50% { opacity: 0.4; }
    }

    .toolbar {
      max-width: 1500px;
      margin: 1rem auto 0;
      padding: 0 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 400px;
      min-width: 250px;
    }

    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.875rem;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .search-box svg {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1rem;
      height: 1rem;
      fill: var(--muted);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .filter-chip {
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
    }

    .filter-chip.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      padding: 1.5rem 2rem 3rem;
      max-width: 1500px;
      margin: 0 auto;
      flex: 1;
      width: 100%;
    }

    @media (max-width: 1024px) {
      .board {
        grid-template-columns: 1fr;
      }
    }

    .column {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .column-header {
      padding: 1.25rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    .column[data-status="todo"] .column-header { background: var(--todo-bg); color: #1e40af; border-bottom-color: #bfdbfe; }
    .column[data-status="doing"] .column-header { background: var(--doing-bg); color: #92400e; border-bottom-color: #fde68a; }
    .column[data-status="done"] .column-header { background: var(--done-bg); color: #065f46; border-bottom-color: #a7f3d0; }

    .count {
      background: #ffffff;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
    }

    .cards {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      min-height: 250px;
      transition: background 0.2s ease;
    }

    .cards.drag-over {
      background: #f1f5f9;
      outline: 2px dashed var(--primary);
      outline-offset: -4px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: var(--shadow-sm);
      cursor: grab;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      border-color: #cbd5e1;
    }

    .card:active {
      cursor: grabbing;
    }

    .card.dragging {
      opacity: 0.4;
      transform: scale(0.97);
    }

    .card.done-checked {
      opacity: 0.7;
      background: #f8fafc;
    }

    .card.done-checked .card-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .card-top {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }

    .card input[type="checkbox"] {
      margin-top: 0.15rem;
      width: 1.2rem;
      height: 1.2rem;
      accent-color: var(--done);
      cursor: pointer;
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-category {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      background: #eff6ff;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 0;
      font-weight: 500;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.85rem;
      padding-top: 0.75rem;
      border-top: 1px solid #f1f5f9;
    }

    .card-actions button {
      font-size: 0.75rem;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      background: #f8fafc;
      color: var(--muted);
    }

    .card-actions button:hover {
      background: #eff6ff;
      color: var(--primary);
      border-color: #bfdbfe;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--surface);
      margin-top: auto;
    }

    .stats {
      font-weight: 600;
      color: var(--text);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Waar knelt het schoentje? — Kanbanbord</h1>
      <p>
        Beheer de website-backlog van Campus Het Spoor. Sleep kaarten tussen kolommen, vink items af in Done, of filter op categorie.
      </p>
    </div>
  </header>

  <div class="top-controls">
    <div class="share-bar" id="shareBar">
      <label for="roomInput">Kamer</label>
      <input type="text" id="roomInput" class="room-input" maxlength="32" autocomplete="off" spellcheck="false" />
      <label for="shareUrl">Link</label>
      <input type="text" id="shareUrl" readonly />
      <button type="button" id="copyLinkBtn" class="primary">Kopieer</button>
      <span class="sync-status connecting" id="syncStatus">
        <span class="dot" aria-hidden="true"></span>
        <span id="syncStatusText">Verbinden…</span>
      </span>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="searchInput" placeholder="Zoek in backlog..." autocomplete="off" />
    </div>
    <div class="filters" id="categoryFilters">
      <button type="button" class="filter-chip active" data-cat="all">Alles</button>
    </div>
    <div style="display: flex; gap: 0.75rem; align-items: center;">
      <span class="stats" id="stats"></span>
      <button type="button" id="resetBtn">Reset</button>
    </div>
  </div>

  <main class="board" id="board"></main>

  <footer>
    Campus Het Spoor — Website Backlog & Roadmap
  </footer>

  <script src="firebase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script type="module">
    const STORAGE_KEY = "campus-spoor-kanban-v3";
    const DEFAULT_ROOM = "spoor";

    const INITIAL_TASKS = [
      { id: "1-1", category: "1. Beheer en gebruiksvriendelijkheid", title: "Simpeler beheer met drag-and-drop; minder ingewikkeld systeem" },
      { id: "1-2", category: "1. Beheer en gebruiksvriendelijkheid", title: "Onderhoudsvriendelijk voor beheerders, eenvoudige updates" },
      { id: "1-3", category: "1. Beheer en gebruiksvriendelijkheid", title: "Platform en toepassingen budgetvriendelijk houden" },
      { id: "2-1", category: "2. Design, layout en schermresoluties", title: "Responsiviteit: GSM, tablet en laptop automatisch laten meeschalen" },
      { id: "2-2", category: "2. Design, layout en schermresoluties", title: "Moderne, aantrekkelijke uitstraling (jong, professioneel voor ouders)" },
      { id: "2-3", category: "2. Design, layout en schermresoluties", title: "Huisstijl: teksten en elementen in officiële schoolkleuren" },
      { id: "2-4", category: "2. Design, layout en schermresoluties", title: "Overzichtelijkere navigatie en structuur (o.a. richtingen)" },
      { id: "2-5", category: "2. Design, layout en schermresoluties", title: "Visuele afwerking: contrasten, homepage, gestylde Google Maps" },
      { id: "3-1", category: "3. Visie, sfeer en content", title: "Pedagogische visie duidelijker, met Campus Het Spoor-identiteit" },
      { id: "3-2", category: "3. Visie, sfeer en content", title: "Sfeer en eerste indruk: school laten leven, interactieve beleving" },
      { id: "3-3", category: "3. Visie, sfeer en content", title: "Kernwaarden visueel uitbeelden (eigentijds leren, zelfstandigheid, samen, betrokken)" },
      { id: "3-4", category: "3. Visie, sfeer en content", title: "Alleen passende, actuele schoolfoto's — geen willekeurige stock" },
      { id: "3-5", category: "3. Visie, sfeer en content", title: "Klikbare foto's met extra informatie" },
      { id: "4-1", category: "4. Studierichtingen en interactief spoor", title: "Overzicht graden, richtingen en lessentabellen begrijpelijker en visueler" },
      { id: "4-2", category: "4. Studierichtingen en interactief spoor", title: "Interactieve roadmap / visueel spoor voor studiepad" },
      { id: "4-3", category: "4. Studierichtingen en interactief spoor", title: "Spoorthema verder uitdiepen in interactieve onderdelen" },
      { id: "5-1", category: "5. Schoolteam en contact", title: "Introductie van het schoolteam op de contactpagina" },
      { id: "5-2", category: "5. Schoolteam en contact", title: "Transparante teamstructuur (groepen, vakken, leerkrachten)" },
      { id: "5-3", category: "5. Schoolteam en contact", title: "Duidelijke contactgegevens en sociale media" },
      { id: "6-1", category: "6. AI chatbot, mascot en zoekfunctie", title: "AI-chatbot subtiel (niet oppoppen, geen half scherm)" },
      { id: "6-2", category: "6. AI chatbot, mascot en zoekfunctie", title: "Mascot/emoji/schoolrobot koppelen aan chatbot" },
      { id: "6-3", category: "6. AI chatbot, mascot en zoekfunctie", title: "FAQ, schoolreglement en inschrijving in chatbot-kennisbank" },
      { id: "6-4", category: "6. AI chatbot, mascot en zoekfunctie", title: "Logging gesprekken + e-mail fallback bij onbeantwoorde vragen" },
      { id: "6-5", category: "6. AI chatbot, mascot en zoekfunctie", title: "Duidelijke zoekbalk op de website" },
      { id: "7-1", category: "7. Veiligheid, juridisch, formulieren", title: "Beveiliging verbeteren; geen open admin-panels; minder host-afhankelijkheid" },
      { id: "7-2", category: "7. Veiligheid, juridisch, formulieren", title: "Volledige rechten op foto's en content (copyright)" },
      { id: "7-3", category: "7. Veiligheid, juridisch, formulieren", title: "Subtiele cookie- en privacyweergave" },
      { id: "7-4", category: "7. Veiligheid, juridisch, formulieren", title: "Google Bedrijfsprofiel claimen; Maps-foto's en reviews" },
      { id: "7-5", category: "7. Veiligheid, juridisch, formulieren", title: "Sollicitaties/vacatures: toestemming directie bij proceswijziging; formulieren naar directie" },
    ];

    const STATUSES = ["todo", "doing", "done"];
    const LABELS = { todo: "Todo", doing: "Doing", done: "Done" };

    const clientId = sessionStorage.getItem("kanban-client-id") || (() => {
      const id = crypto.randomUUID();
      sessionStorage.setItem("kanban-client-id", id);
      return id;
    })();

    let state = loadState();
    let currentFilter = "all";
    let searchQuery = "";
    let applyingRemote = false;
    let syncPushTimer = null;
    let syncMode = "local";
    let firebaseUnsub = null;
    let webrtcProvider = null;

    function sanitizeRoom(raw) {
      return String(raw || "").trim().toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 32) || DEFAULT_ROOM;
    }

    function getRoomId() {
      const params = new URLSearchParams(location.search);
      return sanitizeRoom(params.get("room") || DEFAULT_ROOM);
    }

    function setRoomInUrl(roomId) {
      const params = new URLSearchParams(location.search);
      params.set("room", roomId);
      history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
    }

    function getShareUrl() {
      const params = new URLSearchParams();
      params.set("room", getRoomId());
      return `${location.origin}${location.pathname}?${params.toString()}`;
    }

    function storageKey() {
      return `${STORAGE_KEY}:${getRoomId()}`;
    }

    function defaultState() {
      return {
        tasks: INITIAL_TASKS.map(t => ({ ...t, status: "todo", checked: false })),
        updatedAt: 0,
        clientId: ""
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(storageKey());
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.tasks) && parsed.tasks.length) {
            parsed.updatedAt = parsed.updatedAt || 0;
            parsed.tasks.forEach(t => { if (t.status === "done") t.checked = true; });
            return parsed;
          }
        }
      } catch (_) {}
      return defaultState();
    }

    function saveState() {
      if (applyingRemote) return;
      state.updatedAt = Date.now();
      state.clientId = clientId;
      localStorage.setItem(storageKey(), JSON.stringify(state));
      scheduleSyncPush();
    }

    function scheduleSyncPush() {
      clearTimeout(syncPushTimer);
      syncPushTimer = setTimeout(pushStateToPeers, 120);
    }

    function fireConfetti() {
      if (typeof confetti !== "function") return;
      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
    }

    function applyRemoteState(remote) {
      if (!remote || !Array.isArray(remote.tasks)) return;
      const remoteAt = remote.updatedAt || 0;
      if (remoteAt < (state.updatedAt || 0)) return;
      if (remoteAt === state.updatedAt && remote.clientId === state.clientId) return;
      const prevTasks = new Map(state.tasks.map(t => [t.id, t.status]));
      applyingRemote = true;
      state = { tasks: remote.tasks, updatedAt: remoteAt, clientId: remote.clientId || "" };
      state.tasks.forEach(t => { if (t.status === "done") t.checked = true; });
      const celebrate = state.tasks.some(t => t.status === "done" && prevTasks.get(t.id) !== "done");
      localStorage.setItem(storageKey(), JSON.stringify(state));
      render();
      applyingRemote = false;
      if (celebrate) fireConfetti();
    }

    function setSyncStatus(kind, text) {
      const el = document.getElementById("syncStatus");
      const textEl = document.getElementById("syncStatusText");
      el.classList.remove("live", "connecting");
      if (kind === "live") el.classList.add("live");
      if (kind === "connecting") el.classList.add("connecting");
      textEl.textContent = text;
    }

    function updateShareUi() {
      document.getElementById("roomInput").value = getRoomId();
      document.getElementById("shareUrl").value = getShareUrl();
    }

    async function pushStateToPeers() {
      if (syncMode === "firebase" && firebaseDb) {
        const { ref, set } = firebaseApi;
        await set(ref(firebaseDb, `rooms/${getRoomId()}`), {
          tasks: state.tasks,
          updatedAt: state.updatedAt,
          clientId: state.clientId
        });
      } else if (syncMode === "webrtc" && yMap) {
        yMap.set("payload", {
          tasks: state.tasks,
          updatedAt: state.updatedAt,
          clientId: state.clientId
        });
      }
    }

    let firebaseDb = null;
    let firebaseApi = null;
    let yMap = null;

    async function initFirebaseSync(cfg) {
      firebaseApi = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js");
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
      const app = initializeApp(cfg);
      firebaseDb = firebaseApi.getDatabase(app);
      syncMode = "firebase";

      const roomRef = firebaseApi.ref(firebaseDb, `rooms/${getRoomId()}`);
      let seeded = false;
      firebaseUnsub = firebaseApi.onValue(roomRef, (snap) => {
        const val = snap.val();
        if (val) applyRemoteState(val);
        else if (!seeded) pushStateToPeers();
        seeded = true;
        setSyncStatus("live", "Live · Firebase");
      });
    }

    async function initWebRtcSync() {
      const Y = await import("https://esm.sh/yjs@13.6.18");
      const { WebrtcProvider } = await import("https://esm.sh/y-webrtc@10.3.0");

      const ydoc = new Y.Doc();
      webrtcProvider = new WebrtcProvider(getRoomId(), ydoc, {
        signaling: ["wss://signaling.yjs.dev", "wss://y-webrtc-eu.fly.dev"]
      });
      yMap = ydoc.getMap("kanban");
      syncMode = "webrtc";

      yMap.observe((event) => {
        if (event.transaction.local) return;
        const payload = yMap.get("payload");
        if (payload) applyRemoteState(payload);
      });

      const updatePresence = () => {
        const n = webrtcProvider.awareness.getStates().size;
        setSyncStatus("live", n > 1 ? `Live · ${n} personen` : "Live · lokaal actief");
      };
      webrtcProvider.awareness.on("change", updatePresence);
      updatePresence();

      const existing = yMap.get("payload");
      if (existing && (existing.updatedAt || 0) > (state.updatedAt || 0)) {
        applyRemoteState(existing);
      } else {
        await pushStateToPeers();
      }
    }

    async function initSync() {
      setSyncStatus("connecting", "Verbinden…");
      updateShareUi();
      const cfg = window.FIREBASE_CONFIG;
      const hasFirebase = cfg && cfg.apiKey && cfg.databaseURL && cfg.databaseURL.startsWith("https://");
      try {
        if (hasFirebase) await initFirebaseSync(cfg);
        else await initWebRtcSync();
      } catch (err) {
        syncMode = "local";
        setSyncStatus("connecting", "Lokaal opgeslagen");
      }
    }

    function switchRoom(newRoomRaw) {
      const newRoom = sanitizeRoom(newRoomRaw);
      if (newRoom === getRoomId()) return;
      if (firebaseUnsub) firebaseUnsub();
      if (webrtcProvider) webrtcProvider.destroy();
      firebaseUnsub = null;
      webrtcProvider = null;
      firebaseDb = null;
      yMap = null;
      setRoomInUrl(newRoom);
      state = loadState();
      render();
      initSync();
    }

    function moveTask(id, direction) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      const idx = STATUSES.indexOf(task.status);
      const next = idx + direction;
      if (next < 0 || next >= STATUSES.length) return;
      const prevStatus = task.status;
      task.status = STATUSES[next];
      if (task.status === "done") {
        task.checked = true;
        if (prevStatus !== "done") fireConfetti();
      } else {
        task.checked = false;
      }
      saveState();
      render();
    }

    function setStatus(id, status) {
      const task = state.tasks.find(t => t.id === id);
      if (!task || task.status === status) return;
      const prevStatus = task.status;
      task.status = status;
      if (status === "done") {
        task.checked = true;
        if (prevStatus !== "done") fireConfetti();
      } else {
        task.checked = false;
      }
      saveState();
      render();
    }

    function toggleChecked(id, checked) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      const prevDone = task.status === "done" && task.checked;
      task.checked = checked;
      if (checked) {
        task.status = "done";
        if (!prevDone) fireConfetti();
      }
      saveState();
      render();
    }

    function setupFilters() {
      const container = document.getElementById("categoryFilters");
      const categories = [...new Set(INITIAL_TASKS.map(t => t.category))];
      
      container.innerHTML = '<button type="button" class="filter-chip active" data-cat="all">Alles</button>';

      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "filter-chip";
        btn.dataset.cat = cat;
        btn.textContent = cat.replace(/^\d+\.\s*/, "");
        btn.addEventListener("click", () => {
          document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
          btn.classList.add("active");
          currentFilter = cat;
          render();
        });
        container.appendChild(btn);
      });

      container.querySelector('[data-cat="all"]').addEventListener("click", () => {
        document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
        container.querySelector('[data-cat="all"]').classList.add("active");
        currentFilter = "all";
        render();
      });
    }

    function updateStats() {
      const total = state.tasks.length;
      const inDone = state.tasks.filter(t => t.status === "done").length;
      document.getElementById("stats").textContent = `${inDone} van ${total} voltooid`;
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function renderCard(task) {
      const card = document.createElement("article");
      card.className = "card" + (task.checked ? " done-checked" : "");
      card.draggable = true;
      card.dataset.id = task.id;

      card.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", task.id);
        card.classList.add("dragging");
      });
      card.addEventListener("dragend", () => card.classList.remove("dragging"));

      const top = document.createElement("div");
      top.className = "card-top";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.checked;
      checkbox.addEventListener("change", () => toggleChecked(task.id, checkbox.checked));

      const body = document.createElement("div");
      body.className = "card-body";
      body.innerHTML = 
        `<div class="card-category">${escapeHtml(task.category.replace(/^\d+\.\s*/, ""))}</div>` +
        `<p class="card-title">${escapeHtml(task.title)}</p>`;

      top.appendChild(checkbox);
      top.appendChild(body);
      card.appendChild(top);

      const actions = document.createElement("div");
      actions.className = "card-actions";

      if (task.status !== "todo") {
        const back = document.createElement("button");
        back.type = "button";
        back.textContent = "← Vorige";
        back.addEventListener("click", () => moveTask(task.id, -1));
        actions.appendChild(back);
      }
      if (task.status !== "done") {
        const fwd = document.createElement("button");
        fwd.type = "button";
        fwd.textContent = "Volgende →";
        fwd.addEventListener("click", () => moveTask(task.id, 1));
        actions.appendChild(fwd);
      }

      card.appendChild(actions);
      return card;
    }

    function render() {
      const board = document.getElementById("board");
      board.innerHTML = "";

      const query = searchQuery.toLowerCase().trim();

      STATUSES.forEach(status => {
        const col = document.createElement("section");
        col.className = "column";
        col.dataset.status = status;

        const tasksHere = state.tasks.filter(t => {
          if (t.status !== status) return false;
          if (currentFilter !== "all" && t.category !== currentFilter) return false;
          if (query && !t.title.toLowerCase().includes(query) && !t.category.toLowerCase().includes(query)) return false;
          return true;
        });

        col.innerHTML = 
          `<div class="column-header"><span>${LABELS[status]}</span>` +
          `<span class="count">${tasksHere.length}</span></div>`;

        const cards = document.createElement("div");
        cards.className = "cards";

        cards.addEventListener("dragover", (e) => {
          e.preventDefault();
          cards.classList.add("drag-over");
        });
        cards.addEventListener("dragleave", () => cards.classList.remove("drag-over"));
        cards.addEventListener("drop", (e) => {
          e.preventDefault();
          cards.classList.remove("drag-over");
          const id = e.dataTransfer.getData("text/plain");
          setStatus(id, status);
        });

        tasksHere.forEach(t => cards.appendChild(renderCard(t)));
        col.appendChild(cards);
        board.appendChild(col);
      });

      updateStats();
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      render();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("Alle kaarten terugzetten naar TODO?")) return;
      state = defaultState();
      saveState();
      render();
    });

    document.getElementById("copyLinkBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(getShareUrl());
        const btn = document.getElementById("copyLinkBtn");
        btn.textContent = "Gekopieerd!";
        setTimeout(() => { btn.textContent = "Kopieer"; }, 2000);
      } catch (_) {}
    });

    document.getElementById("roomInput").addEventListener("change", (e) => {
      switchRoom(e.target.value);
    });

    if (!new URLSearchParams(location.search).has("room")) {
      setRoomInUrl(DEFAULT_ROOM);
    }

    setupFilters();
    render();
    updateShareUi();
    initSync();
  </script>
</body>
</html>
